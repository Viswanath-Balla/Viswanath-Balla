<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Viswanath Balla — AI/ML and Generative AI</title>
<desc id="desc">A dark, modern portfolio banner with subtle grid lines, glowing gradient accents and the title AI/ML developer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#111b31"/><stop offset="1" stop-color="#17152e"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6be"/><stop offset=".52" stop-color="#6b8cff"/><stop offset="1" stop-color="#b58cff"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#6b8cff" stop-opacity=".24"/><stop offset="1" stop-color="#6b8cff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a9b9d5" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/><rect width="1200" height="330" rx="24" fill="url(#grid)"/>
<circle cx="1000" cy="80" r="190" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="1040" cy="170" r="112" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="1.5"/>
<circle cx="1040" cy="170" r="78" fill="none" stroke="#91a5c8" stroke-opacity=".24" stroke-dasharray="4 9"/>
<circle cx="1040" cy="170" r="42" fill="none" stroke="url(#accent)" stroke-opacity=".65" stroke-width="1.5"/>
<circle cx="1124" cy="105" r="6" fill="#55d6be"/><circle cx="947" cy="233" r="4" fill="#b58cff"/>
