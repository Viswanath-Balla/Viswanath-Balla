<path d="M65 55h58" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
<text x="65" y="105" fill="#91a5c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="4">PORTFOLIO  /  2026</text>
