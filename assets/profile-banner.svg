<text x="66" y="270" fill="#b5c1d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Building intelligent systems and turning ideas into useful products.</text>
<rect x="65" y="294" width="270" height="3" rx="1.5" fill="url(#accent)" opacity=".9"/>
</svg>